; ============================================================================
;  Risk-Runway cold-outreach mail merge  —  Resend edition  —  configuration
;
;  1. COPY this file to  config.ini   (config.ini is the one the script reads)
;  2. Fill in your real values below
;  3. NEVER commit config.ini anywhere — it holds your Resend API key
; ============================================================================

[resend]
; Your Resend API key. Get one at https://resend.com -> API Keys.
; It looks like:  re_xxxxxxxxxxxxxxxxxxxxxxxxxxxx
api_key = re_your_key_here

; Safety guard: the script refuses to send unless from_email is on your
; verified sending domain (try-risk-runway.com). Only set this to yes if you
; deliberately want to send from a different verified domain.
allow_any_domain = no

[sender]
; How your name shows up in the recipient's inbox
from_name  = Brooke Bouy

; The address emails are sent FROM. MUST be on a domain you've verified in
; Resend (DNS records added + status "Verified"). Use your marketing domain,
; NOT risk-runway.com — keep cold-email reputation off your app domain.
from_email = brooke@try-risk-runway.com

; A real reply-to address. This can be a normal mailbox you actually read
; (e.g. a Google Workspace / Outlook inbox on try-risk-runway.com, or even
; your existing address). Replies and unsubscribe requests land here.
reply_to   = brooke@try-risk-runway.com

; --- CAN-SPAM required footer info (this is the law, don't skip it) ---
; A real physical mailing address (street, or a registered PO box)
physical_address = 123 Main St, Suite 100, Baton Rouge, LA 70801

; Where an unsubscribe request goes. Simplest compliant option: an email.
unsubscribe_email = brooke@try-risk-runway.com

[send]
; Which email template to use — must match a file in the templates/ folder
; (without the .txt extension). Options provided: version_a, version_b
template = version_a

; Safety throttle so you don't torch your domain's sending reputation.
; Max emails to send in ONE run of the script. During warmup keep this LOW
; (20-40/day) and raise it gradually over a couple of weeks.
max_per_run = 40

; Random pause between each send, in seconds (min and max).
min_delay_seconds = 45
max_delay_seconds = 90

[data]
; ---- SIAA workbook ----
siaa_file = SIAA List TN. - Brooke.xlsx
; Which sheet(s) to pull from. Comma-separated.
; "ISM List" is the full national master (~4,800 contacts).
; Use "Brooke Tennessee" for just the TN subset, or list several.
siaa_sheets = Brooke Tennessee

; ---- Mississippi / Iroquois workbook ----
iroquois_file = Mississippi Iroquois member list.xlsx
; Set to yes to include this list, no to skip it.
include_iroquois = no
