<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Risk Runway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-gray-900 p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-700">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white">Risk Runway</h1>
                <p class="text-gray-400 mt-2">Create your account</p>
            </div>

            <form id="registerForm" class="space-y-5">
                <div>
                    <label for="full_name" class="block text-sm font-medium text-gray-300 mb-2">
                        Full Name
                    </label>
                    <input type="text"
                           id="full_name"
                           name="full_name"
                           required
                           autocomplete="name"
                           class="w-full px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Enter your full name">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                        Email
                    </label>
                    <input type="email"
                           id="email"
                           name="email"
                           required
                           autocomplete="email"
                           class="w-full px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Enter your email">
                </div>

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300 mb-2">
                        Username
                    </label>
                    <input type="text"
                           id="username"
                           name="username"
                           required
                           autocomplete="username"
                           class="w-full px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Choose a username">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                        Password
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           autocomplete="new-password"
                           class="w-full px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Create a password (12+ characters)">
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-300 mb-2">
                        Confirm Password
                    </label>
                    <input type="password"
                           id="confirm_password"
                           name="confirm_password"
                           required
                           autocomplete="new-password"
                           class="w-full px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Confirm your password">
                </div>

                <div id="errorMessage" class="hidden bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded">
                </div>

                <div id="successMessage" class="hidden bg-green-900 border border-green-700 text-green-200 px-4 py-3 rounded">
                </div>

                <button type="submit"
                        id="registerButton"
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-4">
                <span class="text-sm text-gray-400">Already have an account?</span>
                <a href="/login" class="text-sm text-blue-400 hover:text-blue-300 transition-colors ml-1">Sign In</a>
            </div>

            <div class="text-center mt-6">
                <a href="/privacy" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">Privacy Policy</a>
            </div>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const registerButton = document.getElementById('registerButton');

        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const full_name = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            // Hide previous messages
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');

            // Client-side validation
            if (password !== confirm_password) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.classList.remove('hidden');
                return;
            }

            if (password.length < 12) {
                errorMessage.textContent = 'Password must be at least 12 characters long';
                errorMessage.classList.remove('hidden');
                return;
            }

            // Disable button during request
            registerButton.disabled = true;
            registerButton.textContent = 'Creating account...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ full_name, email, username, password })
                });

                const data = await response.json();

                if (data.success) {
                    successMessage.textContent = 'Account created! Redirecting to login...';
                    successMessage.classList.remove('hidden');
                    registerForm.reset();
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    errorMessage.textContent = data.error || 'Registration failed';
                    errorMessage.classList.remove('hidden');
                    registerButton.disabled = false;
                    registerButton.textContent = 'Create Account';
                }
            } catch (error) {
                errorMessage.textContent = 'An error occurred. Please try again.';
                errorMessage.classList.remove('hidden');
                registerButton.disabled = false;
                registerButton.textContent = 'Create Account';
            }
        });

        // Focus first field on load
        document.getElementById('full_name').focus();
    </script>
</body>
</html>
