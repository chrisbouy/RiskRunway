<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Risk Runway</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue:   #4a9eff;
            --orange: #ff9f40;
            --green:  #4ade80;
            --bg:     #0a0a0a;
            --surface: #1a1a1a;
            --border: #2a2a2a;
            --text:   #e5e5e5;
            --text-muted: #a0a0a0;
            --text-xmuted: #707070;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: 'IBM Plex Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .app-shell {
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOP BAR ── */
        .top-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 16px;
            padding-top: max(2px, env(safe-area-inset-top));
            background: #334155;
            border-bottom: 1px solid #475569;
        }
        .top-bar-logo { display: flex; align-items: center; }
        .top-bar-logo img { height: 72px; width: auto; display: block; }
        .hamburger-btn {
            background: none; border: none; color: #f1f5f9;
            font-size: 24px; padding: 6px; cursor: pointer; border-radius: 6px;
            line-height: 1;
        }
        .hamburger-btn:active { background: #475569; }

        /* ── SLIDE-OUT MENU ── */
        .menu-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 900;
        }
        .menu-overlay.active { display: block; }
        .menu-panel {
            position: fixed; top: 0; right: -260px; width: 260px; height: 100%;
            background: #111; border-left: 1px solid var(--border);
            z-index: 901; transition: right 0.25s ease;
            padding: 20px 16px;
            padding-top: max(20px, env(safe-area-inset-top));
            display: flex; flex-direction: column; gap: 8px;
        }
        .menu-panel.active { right: 0; }
        .menu-item {
            display: flex; align-items: center; gap: 10px;
            padding: 12px; border-radius: 8px; background: none; border: none;
            color: var(--text); font-size: 15px; font-weight: 500;
            font-family: inherit; cursor: pointer; text-align: left; width: 100%;
        }
        .menu-item:active { background: var(--border); }
        .menu-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .menu-divider { height: 1px; background: var(--border); margin: 8px 0; }
        .menu-item.danger { color: #f07070; }

        /* ── COLUMN HEADERS ── */
        .board-header {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            border-bottom: 2px solid var(--border);
        }
        .col-head {
            text-align: center;
            padding: 10px 4px 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-right: 1px solid var(--border);
        }
        .col-head:last-child { border-right: none; }
        .col-head-sub { color: var(--blue); }
        .col-head-quot { color: var(--orange); }
        .col-head-bind { color: var(--green); }

        /* ── BOARD BODY (scrollable rows) ── */
        .board-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0;
        }

        /* ── RUNWAY LIGHTS ── */
        .runway-lights {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            width: 100%;
        }
        .runway-dot {
            width: 4px; height: 4px; border-radius: 50%;
            background: #b8860b; opacity: 0.4;
            animation: dot-glow 3s ease-in-out infinite;
        }
        .runway-dot:nth-child(2) { animation-delay: 0.3s; }
        .runway-dot:nth-child(3) { animation-delay: 0.6s; }
        .runway-dot:nth-child(4) { animation-delay: 0.9s; }
        .runway-dot:nth-child(5) { animation-delay: 1.2s; }
        .runway-dot:nth-child(6) { animation-delay: 1.5s; }
        .runway-dot:nth-child(7) { animation-delay: 1.8s; }
        .runway-dot:nth-child(8) { animation-delay: 2.1s; }
        .runway-dot:nth-child(9) { animation-delay: 2.4s; }
        .runway-dot:nth-child(10) { animation-delay: 2.7s; }
        .runway-dot:nth-child(11) { animation-delay: 3.0s; }
        .runway-dot:nth-child(12) { animation-delay: 0.15s; }
        .runway-dot:nth-child(13) { animation-delay: 0.45s; }
        .runway-dot:nth-child(14) { animation-delay: 0.75s; }
        .runway-dot:nth-child(15) { animation-delay: 1.05s; }
        .runway-dot:nth-child(16) { animation-delay: 1.35s; }
        .runway-dot:nth-child(17) { animation-delay: 1.65s; }
        .runway-dot:nth-child(18) { animation-delay: 1.95s; }
        .runway-dot:nth-child(19) { animation-delay: 2.25s; }
        .runway-dot:nth-child(20) { animation-delay: 2.55s; }
        @keyframes dot-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.4); background: #ffd700; }
        }

        /* ── CARD ROW (3 columns) ── */
        .card-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            min-height: 44px;
        }
        .card-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
            border-right: 1px solid var(--border);
        }
        .card-cell:last-child { border-right: none; }

        /* ── CARD ── */
        .m-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 6px;
            width: 100%;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            transition: transform 0.1s;
        }
        .m-card:active { transform: scale(0.97); }
        .m-card.is-bound { border-color: var(--green); border-width: 2px; }
        .m-card.is-renewal { border-color: #60a5fa; border-width: 2px; }
        .m-card-name {
            font-size: 13px; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-align: center; line-height: 1.3;
        }

        /* ── LONG-PRESS PREVIEW ── */
        .preview-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); z-index: 1000;
            align-items: center; justify-content: center; padding: 24px;
        }
        .preview-overlay.active { display: flex; }
        .preview-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; width: 100%; max-width: 320px;
            max-height: 70vh; overflow-y: auto;
        }
        .preview-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .preview-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px;
        }
        .preview-row:last-child { border-bottom: none; }
        .preview-label { color: var(--text-muted); }
        .preview-value { color: var(--text); font-weight: 500; text-align: right; max-width: 60%; }
        .preview-badge {
            display: inline-block; font-size: 10px; font-weight: 600;
            padding: 2px 8px; border-radius: 4px; margin-top: 8px;
        }
        .badge-sub { background: rgba(74,158,255,0.2); color: var(--blue); }
        .badge-quot { background: rgba(255,159,64,0.2); color: var(--orange); }
        .badge-bind { background: rgba(74,222,128,0.2); color: var(--green); }
        .preview-close {
            display: block; width: 100%; margin-top: 16px; padding: 10px;
            background: var(--border); border: none; border-radius: 8px;
            color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer;
        }
        .preview-close:active { background: #333; }

        .move-to-btn {
            flex: 1; padding: 10px 8px; border-radius: 6px; font-size: 13px;
            font-weight: 600; font-family: inherit; cursor: pointer;
            background: none; border: 2px solid; text-align: center;
        }
        .move-to-btn:active { opacity: 0.7; }

        /* ── MODAL ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 2000; align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-sheet {
            background: var(--surface); border-top-left-radius: 16px; border-top-right-radius: 16px;
            width: 100%; max-height: 80vh; padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom)); overflow-y: auto;
        }
        .modal-sheet h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .modal-input {
            width: 100%; padding: 12px; font-size: 16px; font-family: inherit;
            background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); margin-bottom: 12px;
        }
        .modal-input:focus { outline: none; border-color: var(--blue); }
        .modal-input::placeholder { color: var(--text-xmuted); }
        .modal-btn-primary {
            width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
            font-family: inherit; background: var(--blue); color: #fff;
            border: none; border-radius: 8px; cursor: pointer;
        }
        .modal-btn-primary:active { opacity: 0.8; }
        .modal-btn-secondary {
            width: 100%; padding: 12px; font-size: 14px; font-weight: 500;
            font-family: inherit; background: none; color: var(--text-muted);
            border: none; cursor: pointer; margin-top: 8px;
        }
        .file-upload-area {
            display: flex; align-items: center; justify-content: center;
            padding: 16px; border: 2px dashed var(--border); border-radius: 8px;
            margin-bottom: 12px; cursor: pointer;
        }
        .file-upload-area:active { border-color: var(--blue); }
        .file-upload-label { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 14px; }
        .file-upload-label svg { color: var(--blue); flex-shrink: 0; }
        .file-selected {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; background: rgba(74,158,255,0.1);
            border: 1px solid var(--blue); border-radius: 8px; margin-bottom: 12px;
            font-size: 13px; color: var(--text);
        }
        .file-selected span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .file-selected button { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 0 4px; margin-left: 8px; }

        /* ── SPINNER ── */
        .spinner-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 3000; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        .spinner-overlay.active { display: flex; }
        .spinner-ring {
            width: 44px; height: 44px; border: 3px solid var(--border);
            border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner-text { font-size: 14px; color: var(--text-muted); text-align: center; }

        /* Broker item */
        .broker-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px;
        }
        .broker-item-info { flex: 1; min-width: 0; }
        .broker-item-name { font-size: 14px; font-weight: 600; color: var(--text); }
        .broker-item-email { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .broker-item-del {
            background: none; border: none; color: #f07070; font-size: 18px;
            cursor: pointer; padding: 4px 8px; flex-shrink: 0;
        }
        /* Doc checkbox row */
        .doc-check-row {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 0; font-size: 13px; color: var(--text);
        }
        .doc-check-row input { width: 18px; height: 18px; accent-color: var(--blue); }

        /* Email message item */
        .msg-item {
            padding: 12px; background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px;
        }
        .msg-subject { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
        .msg-from { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .msg-date { font-size: 11px; color: var(--text-xmuted); }
        .msg-attachments { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
        .msg-att-badge {
            font-size: 11px; padding: 2px 8px; border-radius: 4px;
            background: rgba(74,158,255,0.15); color: var(--blue);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
        }
        .msg-actions { margin-top: 8px; display: flex; gap: 8px; }
        .msg-btn {
            font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px;
            border: none; cursor: pointer; font-family: inherit;
        }
        .msg-btn-process { background: #7c3aed; color: #fff; }
        .msg-btn-process:active { opacity: 0.8; }
        .msg-btn-dismiss { background: var(--border); color: var(--text-muted); }
        .msg-btn-dismiss:active { background: #333; }
        .msg-btn-read { background: rgba(74,158,255,0.2); color: var(--blue); }
        .msg-btn-read:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            <div class="top-bar-logo">
                <img src="{{ url_for('static', filename='images/mobile_title_bluebg.png') }}" alt="Risk Runway">
            </div>
            <button class="hamburger-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
        </header>

        <div class="board-header">
            <div class="col-head col-head-sub">Submission</div>
            <div class="col-head col-head-quot">Quoting</div>
            <div class="col-head col-head-bind">Binding</div>
        </div>

        <div class="board-body" id="boardBody"></div>
    </div>

    <!-- Slide-out Menu -->
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="menu-panel" id="menuPanel">
        <button class="menu-item" id="menuClose" style="justify-content:flex-end;padding:8px;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button class="menu-item" id="menuNew">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            New Submission
        </button>
        <div class="menu-divider"></div>
        <label class="menu-item" style="cursor:pointer;">
            <input type="checkbox" id="menuFilterMyCards" style="width:18px;height:18px;accent-color:var(--blue);">
            My Cards Only
        </label>
        <button class="menu-item" id="menuConfigureBrokers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
            Configure Brokers
        </button>
        <button class="menu-item" id="menuQuoteSettings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            Quote Settings
        </button>
        <button class="menu-item" id="menuCheckEmail">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Check Email
        </button>
        <button class="menu-item" id="menuUserGuide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
            User Guide
        </button>
        <button class="menu-item" id="menuReportBug" style="color:#f07070;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2l1.88 1.88M14.12 3.88L16 2M9 7.13v-1a3 3 0 016 0v1M12 20c-3.87 0-7-3.13-7-7h14c0 3.87-3.13 7-7 7zM5 13H2M22 13h-3M5 17l-2 2M19 17l2 2"/></svg>
            Report Bug
        </button>
        <div class="menu-divider"></div>
        <div style="padding:8px 12px;font-size:11px;color:var(--text-xmuted);">
            Logged in as
            <div id="menuUserName" style="font-size:13px;font-weight:600;color:var(--text);margin-top:2px;"></div>
            <div id="menuUserRole" style="display:inline-block;margin-top:4px;font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;background:rgba(74,114,196,0.3);color:#92a8d8;padding:1px 5px;border-radius:3px;"></div>
        </div>
        <button class="menu-item danger" id="menuLogout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </button>
    </div>

    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner-ring"></div>
        <div class="spinner-text" id="spinnerText">Parsing application...</div>
    </div>

    <div class="preview-overlay" id="previewOverlay">
        <div class="preview-card" id="previewCard"></div>
    </div>

    <div class="modal-overlay" id="newModal">
        <div class="modal-sheet">
            <h3>New Submission</h3>
            <input class="modal-input" id="newInsuredName" type="text" placeholder="Insured name (optional if uploading)" autocomplete="off">
            <label class="file-upload-area" id="fileUploadArea">
                <input type="file" id="newFile" accept=".pdf,.png,.jpg,.jpeg" style="display:none">
                <div class="file-upload-label">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span>Upload ACORD / Application</span>
                </div>
            </label>
            <div class="file-selected" id="fileSelected" style="display:none">
                <span id="fileName"></span>
                <button id="fileClear" type="button">&#10005;</button>
            </div>
            <button class="modal-btn-primary" id="createSubmissionBtn">Create</button>
            <button class="modal-btn-secondary" id="cancelNewBtn">Cancel</button>
        </div>
    </div>

    <!-- Configure Brokers Modal -->
    <div class="modal-overlay" id="brokersModal">
        <div class="modal-sheet">
            <h3>Configure Brokers</h3>
            <div id="brokersList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:40vh;overflow-y:auto;"></div>
            <div style="border-top:1px solid var(--border);padding-top:12px;">
                <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-muted);">Add Broker</div>
                <input class="modal-input" id="addBrokerName" type="text" placeholder="Broker name" style="margin-bottom:8px;">
                <input class="modal-input" id="addBrokerEmail" type="email" placeholder="Email address" style="margin-bottom:8px;">
                <button class="modal-btn-primary" id="addBrokerBtn" style="font-size:14px;padding:10px;">Add</button>
            </div>
            <button class="modal-btn-secondary" id="closeBrokersModalBtn">Close</button>
        </div>
    </div>

    <!-- Quote Settings Modal -->
    <div class="modal-overlay" id="quoteSettingsModal">
        <div class="modal-sheet">
            <h3>Quote Settings</h3>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;">Quote Compare Threshold (%)</label>
                <input class="modal-input" id="mQuoteCompareThreshold" type="number" min="0" max="100" style="margin-bottom:0;">
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;">Renewal Highlight Threshold (%)</label>
                <input class="modal-input" id="mRenewalThreshold" type="number" min="0" max="100" style="margin-bottom:0;">
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;">Default Required Docs</label>
                <div id="mDocsChecklist" style="max-height:30vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
            </div>
            <button class="modal-btn-primary" id="saveQuoteSettingsBtn">Save</button>
            <button class="modal-btn-secondary" id="closeQuoteSettingsBtn">Cancel</button>
        </div>
    </div>

    <!-- Check Email handled directly via spinner, no modal needed -->

    <!-- New Messages Modal (shown after email check finds messages) -->
    <div class="modal-overlay" id="newMessagesModal">
        <div class="modal-sheet" style="max-height:85vh;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <h3 style="margin:0;">New Messages</h3>
                <button id="closeNewMessagesBtn" style="background:none;border:none;color:var(--text-muted);font-size:24px;cursor:pointer;">&times;</button>
            </div>
            <div id="newMessagesList" style="display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:65vh;"></div>
            <button class="modal-btn-secondary" id="dismissAllMessagesBtn">Close</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        let submissions = [];
        let longPressTimer = null;
        let longPressFired = false;
        const LONG_PRESS_MS = 500;
        const NUM_DOTS = 20;

        function normalizeStatus(status) {
            const s = (status || '').trim().toUpperCase().replace(/\s+/g, '_');
            if (s === 'RECEIVED') return 'RECEIVED';
            if (s === 'IN_PROGRESS') return 'IN_PROGRESS';
            return 'BIND';
        }

        function getStageKey(sub) {
            const n = normalizeStatus(sub.status);
            if (n === 'RECEIVED') return 'submission';
            if (n === 'IN_PROGRESS') return 'quoting';
            return 'bind';
        }

        // ── Data ──
        async function loadSubmissions() {
            try {
                const filterParam = filterMyCards ? '?assigned_to_me=true' : '';
                const resp = await fetch('/api/submissions' + filterParam);
                const data = await resp.json();
                if (data.success) { submissions = data.submissions; renderBoard(); }
            } catch (e) { console.error(e); }
        }

        // ── Create a full-width runway lights element ──
        function createLights() {
            const el = document.createElement('div');
            el.className = 'runway-lights';
            for (let i = 0; i < NUM_DOTS; i++) {
                const d = document.createElement('div');
                d.className = 'runway-dot';
                el.appendChild(d);
            }
            return el;
        }

        // ── Render board as: lights, card-row, lights, card-row, lights... ──
        function renderBoard() {
            const body = document.getElementById('boardBody');
            body.innerHTML = '';

            const grouped = { submission: [], quoting: [], bind: [] };
            submissions.forEach(sub => grouped[getStageKey(sub)].push(sub));

            // Each submission gets its own row — one card per row, placed in the correct column
            const allRows = [];
            ['submission', 'quoting', 'bind'].forEach(stage => {
                grouped[stage].forEach(sub => {
                    allRows.push({ sub, stage });
                });
            });

            if (allRows.length === 0) {
                body.appendChild(createLights());
                return;
            }

            allRows.forEach(({ sub, stage }) => {
                body.appendChild(createLights());

                const row = document.createElement('div');
                row.className = 'card-row';

                ['submission', 'quoting', 'bind'].forEach(col => {
                    const cell = document.createElement('div');
                    cell.className = 'card-cell';
                    if (col === stage) cell.appendChild(createCard(sub, stage));
                    row.appendChild(cell);
                });

                body.appendChild(row);
            });

            body.appendChild(createLights());
        }

        function createCard(submission, stage) {
            const card = document.createElement('div');
            card.className = 'm-card';
            const isBound = submission.is_bound || submission.status === 'Sent to Finance';
            if (isBound) card.classList.add('is-bound');
            if (submission.is_renewal && stage === 'quoting') card.classList.add('is-renewal');

            const displayName = submission.short_name || submission.insured_name;
            card.innerHTML = '<div class="m-card-name">' + escapeHtml(displayName) + '</div>';

            card.addEventListener('click', () => {
                if (!longPressFired) window.location.href = '/submission/' + submission.id;
                longPressFired = false;
            });
            card.addEventListener('touchstart', () => {
                longPressFired = false;
                longPressTimer = setTimeout(() => {
                    longPressFired = true; longPressTimer = null;
                    showPreview(submission, stage);
                }, LONG_PRESS_MS);
            }, { passive: true });
            card.addEventListener('touchend', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } });
            card.addEventListener('touchmove', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } });

            return card;
        }

        // ── Preview ──
        function showPreview(submission, stage) {
            const overlay = document.getElementById('previewOverlay');
            const card = document.getElementById('previewCard');
            const quoteCount = submission.quote_count || 0;
            const docCount = (submission.documents || []).length;
            const coverageTypes = (submission.submission_intake && submission.submission_intake.coverage_types) || [];
            const statusLabel = submission.status_label || '';
            const badgeClass = stage === 'submission' ? 'badge-sub' : stage === 'quoting' ? 'badge-quot' : 'badge-bind';
            const stageLabel = stage === 'submission' ? 'Submission' : stage === 'quoting' ? 'Quoting' : 'Bound';

            let renewalHtml = '';
            if (stage !== 'submission' && submission.effective_date) {
                const days = getDaysUntilRenewal(submission.effective_date);
                if (days !== null) {
                    const c = days <= 30 ? '#ef4444' : days <= 60 ? '#ff9f40' : '#4ade80';
                    renewalHtml = '<div class="preview-row"><span class="preview-label">Renewal In</span><span class="preview-value" style="color:'+c+'">'+days+' days</span></div>';
                }
            }

            // Build "Move to" buttons for other stages
            const stages = [
                { key: 'submission', label: 'Submission', apiStatus: 'RECEIVED', color: 'var(--blue)' },
                { key: 'quoting', label: 'Quoting', apiStatus: 'IN_PROGRESS', color: 'var(--orange)' },
                { key: 'bind', label: 'Binding', apiStatus: 'CHOSEN', color: 'var(--green)' }
            ];
            const moveButtons = stages.filter(s => s.key !== stage).map(s =>
                '<button class="move-to-btn" data-status="'+s.apiStatus+'" data-stage="'+s.key+'" style="border-color:'+s.color+';color:'+s.color+';">'+s.label+'</button>'
            ).join('');

            // Build docs list
            const docs = submission.documents || [];
            let docsHtml = '';
            if (docs.length > 0) {
                docsHtml = '<div style="margin-top:12px;"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Documents</div>' +
                    docs.map(d => '<a href="/api/documents/'+d.id+'/download" target="_blank" style="display:block;font-size:12px;color:var(--blue);padding:5px 0;text-decoration:none;border-bottom:1px solid var(--border);">' + escapeHtml(d.name || d.original_filename || 'file') + '</a>').join('') +
                '</div>';
            }

            card.innerHTML =
                '<h3>'+escapeHtml(submission.insured_name)+'</h3>'+
                '<div style="margin-top:12px;">'+
                '<div class="preview-row"><span class="preview-label">Quotes</span><span class="preview-value">'+quoteCount+'</span></div>'+
                '<div class="preview-row"><span class="preview-label">Documents</span><span class="preview-value">'+docCount+'</span></div>'+
                (coverageTypes.length ? '<div class="preview-row"><span class="preview-label">Coverage</span><span class="preview-value">'+escapeHtml(coverageTypes.join(', '))+'</span></div>' : '')+
                (statusLabel ? '<div class="preview-row"><span class="preview-label">Note</span><span class="preview-value">'+escapeHtml(statusLabel)+'</span></div>' : '')+
                renewalHtml+'</div>'+
                docsHtml+
                '<div style="margin-top:14px;"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Move to</div>'+
                '<div style="display:flex;gap:8px;">'+moveButtons+'</div></div>'+
                '<button class="preview-close" id="previewCloseBtn">Close</button>';

            overlay.classList.add('active');
            document.getElementById('previewCloseBtn').addEventListener('click', () => overlay.classList.remove('active'));

            // Wire up move buttons
            card.querySelectorAll('.move-to-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const targetStatus = btn.dataset.status;
                    const targetStage = btn.dataset.stage;
                    overlay.classList.remove('active');

                    // If moving to bind, use the drag_to_bind endpoint
                    if (targetStage === 'bind') {
                        try {
                            const resp = await fetch('/api/submission/'+submission.id+'/drag_to_bind', { method: 'POST', headers: {'Content-Type':'application/json'} });
                            const data = await resp.json();
                            if (!data.success) { alert(data.message || data.error || 'Cannot move to bind'); return; }
                        } catch(e) { alert('Network error'); return; }
                    } else {
                        try {
                            const resp = await fetch('/api/submission/'+submission.id+'/status', {
                                method: 'PUT',
                                headers: {'Content-Type':'application/json'},
                                body: JSON.stringify({ status: targetStatus })
                            });
                            const data = await resp.json();
                            if (!data.success) { alert(data.error || 'Move failed'); return; }
                        } catch(e) { alert('Network error'); return; }
                    }
                    await loadSubmissions();
                });
            });
        }

        document.getElementById('previewOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
        });

        // ── Helpers ──
        function getDaysUntilRenewal(effectiveDate) {
            if (!effectiveDate) return null;
            const parsed = new Date(String(effectiveDate).slice(0,10) + 'T00:00:00');
            if (isNaN(parsed.getTime())) return null;
            const exp = new Date(parsed); exp.setFullYear(exp.getFullYear() + 1);
            const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            return Math.ceil((exp.getTime() - today.getTime()) / 86400000);
        }
        function escapeHtml(v) {
            return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ── New Submission ──
        let selectedFile = null;
        document.getElementById('menuNew').addEventListener('click', () => {
            closeMenu();
            document.getElementById('newModal').classList.add('active');
            setTimeout(() => document.getElementById('newInsuredName').focus(), 100);
        });
        document.getElementById('cancelNewBtn').addEventListener('click', () => {
            document.getElementById('newModal').classList.remove('active');
            document.getElementById('newInsuredName').value = ''; clearFile();
        });
        document.getElementById('newFile').addEventListener('change', (e) => {
            const f = e.target.files[0];
            if (f) { selectedFile = f; document.getElementById('fileName').textContent = f.name; document.getElementById('fileSelected').style.display = 'flex'; document.getElementById('fileUploadArea').style.display = 'none'; }
        });
        document.getElementById('fileClear').addEventListener('click', (e) => { e.stopPropagation(); clearFile(); });
        function clearFile() { selectedFile = null; document.getElementById('newFile').value = ''; document.getElementById('fileSelected').style.display = 'none'; document.getElementById('fileUploadArea').style.display = 'flex'; }

        document.getElementById('createSubmissionBtn').addEventListener('click', async () => {
            const name = document.getElementById('newInsuredName').value.trim();
            if (!name && !selectedFile) { alert('Enter a name or upload an application'); return; }
            const btn = document.getElementById('createSubmissionBtn');
            const spinner = document.getElementById('spinnerOverlay');
            if (selectedFile) { document.getElementById('spinnerText').textContent = 'Parsing application...'; spinner.classList.add('active'); }
            else { btn.textContent = 'Creating...'; btn.disabled = true; }
            try {
                const fd = new FormData();
                if (name) fd.append('insured_name', name);
                if (selectedFile) fd.append('file', selectedFile);
                const resp = await fetch('/api/submission/create', { method: 'POST', body: fd });
                const data = await resp.json();
                if (data.success) { document.getElementById('newModal').classList.remove('active'); document.getElementById('newInsuredName').value = ''; clearFile(); await loadSubmissions(); }
                else alert(data.error || 'Failed');
            } catch(e) { alert('Network error'); }
            finally { spinner.classList.remove('active'); btn.textContent = 'Create'; btn.disabled = false; }
        });

        // ── Menu ──
        let filterMyCards = false;
        function openMenu() { document.getElementById('menuOverlay').classList.add('active'); document.getElementById('menuPanel').classList.add('active'); }
        function closeMenu() { document.getElementById('menuOverlay').classList.remove('active'); document.getElementById('menuPanel').classList.remove('active'); }
        document.getElementById('menuBtn').addEventListener('click', () => {
            if (document.getElementById('menuPanel').classList.contains('active')) closeMenu();
            else openMenu();
        });
        document.getElementById('menuOverlay').addEventListener('click', closeMenu);
        document.getElementById('menuClose').addEventListener('click', closeMenu);
        document.getElementById('menuLogout').addEventListener('click', async () => { if (confirm('Log out?')) { await fetch('/logout',{method:'POST'}); window.location.href='/login'; } });
        document.getElementById('menuFilterMyCards').addEventListener('change', (e) => { filterMyCards = e.target.checked; loadSubmissions(); });
        document.getElementById('menuConfigureBrokers').addEventListener('click', () => { closeMenu(); openBrokersModal(); });
        document.getElementById('menuQuoteSettings').addEventListener('click', () => { closeMenu(); openQuoteSettingsModal(); });
        document.getElementById('menuCheckEmail').addEventListener('click', () => { closeMenu(); checkEmailDirect(); });
        document.getElementById('menuUserGuide').addEventListener('click', () => { closeMenu(); alert('User Guide coming soon to mobile.'); });
        document.getElementById('menuReportBug').addEventListener('click', () => { closeMenu(); alert('Bug reporting coming soon to mobile. Use the desktop version for now.'); });

        // Load user info for menu
        async function loadUserInfo() {
            try {
                const resp = await fetch('/api/users');
                const data = await resp.json();
                if (data.success && data.current_user) {
                    document.getElementById('menuUserName').textContent = data.current_user.full_name || data.current_user.username;
                    document.getElementById('menuUserRole').textContent = data.current_user.role || '';
                }
            } catch(e) {}
        }
        loadUserInfo();

        // ── Configure Brokers Modal ──
        async function openBrokersModal() {
            document.getElementById('brokersModal').classList.add('active');
            await loadBrokersForMobile();
        }
        document.getElementById('closeBrokersModalBtn').addEventListener('click', () => document.getElementById('brokersModal').classList.remove('active'));
        document.getElementById('brokersModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('active'); });

        async function loadBrokersForMobile() {
            const list = document.getElementById('brokersList');
            list.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">Loading...</div>';
            try {
                const resp = await fetch('/api/brokers');
                const data = await resp.json();
                if (data.success) {
                    if (data.brokers.length === 0) { list.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">No brokers configured yet.</div>'; return; }
                    list.innerHTML = data.brokers.map(b => `
                        <div class="broker-item">
                            <div class="broker-item-info">
                                <div class="broker-item-name">${escapeHtml(b.name || 'Unnamed')}</div>
                                <div class="broker-item-email">${b.is_portal ? escapeHtml(b.portal_name) : escapeHtml(b.email)}</div>
                            </div>
                            <button class="broker-item-del" data-id="${b.id}">&times;</button>
                        </div>
                    `).join('');
                    list.querySelectorAll('.broker-item-del').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            if (confirm('Delete this broker?')) {
                                await fetch('/api/brokers/' + btn.dataset.id, { method: 'DELETE' });
                                await loadBrokersForMobile();
                            }
                        });
                    });
                }
            } catch(e) { list.innerHTML = '<div style="color:#f07070;font-size:13px;">Error loading brokers</div>'; }
        }

        document.getElementById('addBrokerBtn').addEventListener('click', async () => {
            const name = document.getElementById('addBrokerName').value.trim();
            const email = document.getElementById('addBrokerEmail').value.trim();
            if (!email) { alert('Email is required'); return; }
            try {
                const resp = await fetch('/api/brokers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name || email, email: email, is_portal: false })
                });
                const data = await resp.json();
                if (data.success) {
                    document.getElementById('addBrokerName').value = '';
                    document.getElementById('addBrokerEmail').value = '';
                    await loadBrokersForMobile();
                } else { alert(data.error || 'Failed to add broker'); }
            } catch(e) { alert('Network error'); }
        });

        // ── Quote Settings Modal ──
        const COMMON_DOCS = [
            'Signed ACORD Application','Copy of Quote','Premium Payment','Loss Runs (4-5 years)',
            'Signed Fraud Statement','MVR Reports','Driver/Fleet Safety Manual',
            'UM/UIM Selection/Rejection Form','Business Auto Questionnaire',
            'Workers Comp Experience Mod Worksheet','Schedule of Values (SOV)',
            'Financial Statements','Certificate of Good Standing',
            'Prior Carrier Cancellation Notice','Supplemental Application'
        ];
        let mQuoteSettings = {};

        async function openQuoteSettingsModal() {
            document.getElementById('quoteSettingsModal').classList.add('active');
            try {
                const resp = await fetch('/api/tenant-settings');
                const data = await resp.json();
                mQuoteSettings = data.success ? (data.settings || {}) : {};
            } catch(e) { mQuoteSettings = {}; }
            document.getElementById('mQuoteCompareThreshold').value = mQuoteSettings.quote_compare_threshold ?? 20;
            document.getElementById('mRenewalThreshold').value = mQuoteSettings.renewal_highlight_threshold ?? 20;
            renderDocsChecklist();
        }

        function renderDocsChecklist() {
            const container = document.getElementById('mDocsChecklist');
            const selected = new Set(mQuoteSettings.default_required_docs || ['Signed ACORD Application', 'Copy of Quote']);
            const allDocs = [...new Set([...COMMON_DOCS, ...(mQuoteSettings.custom_required_docs || [])])];
            container.innerHTML = allDocs.map(doc => `
                <label class="doc-check-row">
                    <input type="checkbox" value="${escapeHtml(doc)}" ${selected.has(doc) ? 'checked' : ''}>
                    ${escapeHtml(doc)}
                </label>
            `).join('');
        }

        document.getElementById('closeQuoteSettingsBtn').addEventListener('click', () => document.getElementById('quoteSettingsModal').classList.remove('active'));
        document.getElementById('quoteSettingsModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('active'); });

        document.getElementById('saveQuoteSettingsBtn').addEventListener('click', async () => {
            const checkedDocs = [];
            document.querySelectorAll('#mDocsChecklist input:checked').forEach(cb => checkedDocs.push(cb.value));
            const payload = {
                default_required_docs: checkedDocs,
                custom_required_docs: mQuoteSettings.custom_required_docs || [],
                quote_compare_threshold: parseInt(document.getElementById('mQuoteCompareThreshold').value, 10),
                renewal_highlight_threshold: parseInt(document.getElementById('mRenewalThreshold').value, 10)
            };
            try {
                const resp = await fetch('/api/tenant-settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (data.success) { document.getElementById('quoteSettingsModal').classList.remove('active'); }
                else alert(data.error || 'Failed to save');
            } catch(e) { alert('Network error'); }
        });

        // ── Check Email (direct, no modal) ──
        let cachedEmails = [];

        async function checkEmailDirect() {
            const spinner = document.getElementById('spinnerOverlay');
            const spinnerText = document.getElementById('spinnerText');
            spinnerText.textContent = 'Checking email...';
            spinner.classList.add('active');
            try {
                const resp = await fetch('/api/email/scrape', { method: 'POST' });
                const data = await resp.json();
                spinner.classList.remove('active');

                if (!data.success && data.needs_connect) {
                    alert('No email account connected. Connect via desktop.');
                } else if (!data.success && data.needs_reauth) {
                    const provider = data.provider || 'gmail';
                    const returnUrl = encodeURIComponent(window.location.href);
                    const oauthResp = await fetch('/api/oauth/connect/' + provider + '?return_url=' + returnUrl);
                    const oauthData = await oauthResp.json();
                    if (oauthData.success && oauthData.authorization_url) {
                        window.location.href = oauthData.authorization_url;
                    } else {
                        alert('Re-authentication failed. Try from desktop.');
                    }
                } else if (!data.success) {
                    alert(data.error || 'Email check failed');
                } else {
                    cachedEmails = data.emails || [];
                    if (cachedEmails.length > 0) {
                        showNewMessagesModal();
                        loadSubmissions();
                    } else {
                        alert('No new messages');
                    }
                }
            } catch(e) {
                spinner.classList.remove('active');
                alert('Network error');
            }
        }

        function showNewMessagesModal() {
            const list = document.getElementById('newMessagesList');
            list.innerHTML = cachedEmails.map((email, idx) => {
                const attHtml = (email.attachments || []).map((att, attIdx) =>
                    '<div style="display:flex;align-items:center;gap:6px;">' +
                        '<span class="msg-att-badge">' + escapeHtml(att.filename) + '</span>' +
                        '<button class="msg-btn msg-btn-process" data-idx="' + idx + '" data-att-idx="' + attIdx + '">Process</button>' +
                    '</div>'
                ).join('');
                const dateStr = email.received_date ? new Date(email.received_date).toLocaleDateString() : '';
                return '<div class="msg-item">' +
                    '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
                        '<div class="msg-subject">' + escapeHtml(email.subject) + '</div>' +
                        '<button class="msg-btn msg-btn-read" data-idx="' + idx + '" style="flex-shrink:0;margin-left:8px;">Read</button>' +
                    '</div>' +
                    '<div class="msg-from">From: ' + escapeHtml(email.from_name || email.from_email) + '</div>' +
                    '<div class="msg-date">' + dateStr + '</div>' +
                    (attHtml ? '<div class="msg-attachments" style="flex-direction:column;align-items:flex-start;">' + attHtml + '</div>' : '') +
                    '<div class="msg-actions">' +
                        '<button class="msg-btn msg-btn-dismiss" data-idx="' + idx + '">Dismiss</button>' +
                    '</div>' +
                '</div>';
            }).join('');

            // Read buttons — mark as read (dismiss from view)
            list.querySelectorAll('.msg-btn-read').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const idx = parseInt(btn.dataset.idx);
                    const email = cachedEmails[idx];
                    if (email && email.message_id) {
                        await fetch('/api/email/dismiss', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message_id: email.message_id, account_id: email.account_id })
                        });
                    }
                    btn.closest('.msg-item').remove();
                    cachedEmails.splice(idx, 1);
                    if (cachedEmails.length === 0) document.getElementById('newMessagesModal').classList.remove('active');
                });
            });

            // Process buttons — process attachment as quote
            list.querySelectorAll('.msg-btn-process').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const idx = parseInt(btn.dataset.idx);
                    const attIdx = parseInt(btn.dataset.attIdx);
                    const email = cachedEmails[idx];
                    if (!email) return;
                    const att = (email.attachments || [])[attIdx];
                    if (!att) return;

                    // Need to pick a submission — try to match by insured name in subject
                    let targetSubmissionId = null;
                    const subjectLower = (email.subject || '').toLowerCase();
                    for (const sub of submissions) {
                        const name = (sub.insured_name || '').toLowerCase();
                        if (name && subjectLower.includes(name)) {
                            targetSubmissionId = sub.id;
                            break;
                        }
                    }

                    if (!targetSubmissionId) {
                        // Ask user to pick
                        const choices = submissions.map(s => s.insured_name).join('\n');
                        const pick = prompt('Which submission is this for?\n\n' + choices);
                        if (!pick) return;
                        const matched = submissions.find(s => s.insured_name.toLowerCase().includes(pick.toLowerCase()));
                        if (matched) targetSubmissionId = matched.id;
                        else { alert('No matching submission found'); return; }
                    }

                    document.getElementById('newMessagesModal').classList.remove('active');
                    const spinner = document.getElementById('spinnerOverlay');
                    document.getElementById('spinnerText').textContent = 'Processing attachment...';
                    spinner.classList.add('active');

                    try {
                        const resp = await fetch('/api/email/process_attachment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                submission_id: targetSubmissionId,
                                message_id: email.message_id,
                                account_id: email.account_id,
                                provider: email.provider || 'outlook',
                                attachment_id: att.attachment_id,
                                filename: att.filename,
                                action_type: 'parse'
                            })
                        });
                        const data = await resp.json();
                        spinner.classList.remove('active');
                        if (data.success) {
                            alert('Attachment processed successfully');
                            loadSubmissions();
                        } else {
                            alert(data.error || 'Processing failed');
                        }
                    } catch(e) { spinner.classList.remove('active'); alert('Network error'); }
                });
            });

            // Dismiss buttons
            list.querySelectorAll('.msg-btn-dismiss').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const idx = parseInt(btn.dataset.idx);
                    const email = cachedEmails[idx];
                    if (email && email.message_id) {
                        await fetch('/api/email/dismiss', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message_id: email.message_id, account_id: email.account_id })
                        });
                    }
                    btn.closest('.msg-item').remove();
                    cachedEmails.splice(idx, 1);
                    if (cachedEmails.length === 0) document.getElementById('newMessagesModal').classList.remove('active');
                });
            });

            document.getElementById('newMessagesModal').classList.add('active');
        }

        document.getElementById('closeNewMessagesBtn').addEventListener('click', () => document.getElementById('newMessagesModal').classList.remove('active'));
        document.getElementById('dismissAllMessagesBtn').addEventListener('click', () => document.getElementById('newMessagesModal').classList.remove('active'));
        document.getElementById('newMessagesModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('active'); });

        // ── Init ──
        loadSubmissions();
    })();
    </script>
</body>
</html>
