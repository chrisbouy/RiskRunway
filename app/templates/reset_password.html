<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Risk Runway</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-gray-900 p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-700">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white">Risk Runway</h1>
                <p class="text-gray-400 mt-2">Choose a New Password</p>
            </div>

            <div id="resetForm">
                <form id="passwordForm" class="space-y-6">
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                            New Password
                        </label>
                        <input type="password"
                               id="password"
                               name="password"
                               required
                               minlength="12"
                               autocomplete="new-password"
                               class="w-full px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Minimum 12 characters">
                        <p class="text-xs text-gray-500 mt-1">Must be at least 12 characters</p>
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-300 mb-2">
                            Confirm Password
                        </label>
                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               required
                               minlength="12"
                               autocomplete="new-password"
                               class="w-full px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Re-enter your password">
                    </div>

                    <div id="errorMessage" class="hidden bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded text-sm">
                    </div>

                    <button type="submit"
                            id="submitButton"
                            class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium">
                        Reset Password
                    </button>
                </form>
            </div>

            <div id="successMessage" class="hidden text-center">
                <div class="bg-green-900 border border-green-700 text-green-200 px-4 py-3 rounded mb-4">
                    <p class="text-sm">Your password has been reset successfully.</p>
                </div>
                <a href="/login" class="inline-block mt-4 bg-blue-600 text-white py-2 px-6 rounded-lg hover:bg-blue-700 font-medium">
                    Go to Login
                </a>
            </div>

            <div class="text-center mt-6">
                <a href="/login" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const token = '{{ token }}';
        const passwordForm = document.getElementById('passwordForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitButton = document.getElementById('submitButton');

        passwordForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            errorMessage.classList.add('hidden');

            if (password.length < 12) {
                errorMessage.textContent = 'Password must be at least 12 characters';
                errorMessage.classList.remove('hidden');
                return;
            }

            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.classList.remove('hidden');
                return;
            }
            
            submitButton.disabled = true;
            submitButton.textContent = 'Resetting...';
            
            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('resetForm').classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                } else {
                    errorMessage.textContent = data.error || 'Something went wrong';
                    errorMessage.classList.remove('hidden');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Reset Password';
                }
            } catch (error) {
                errorMessage.textContent = 'An error occurred. Please try again.';
                errorMessage.classList.remove('hidden');
                submitButton.disabled = false;
                submitButton.textContent = 'Reset Password';
            }
        });

        document.getElementById('password').focus();
    </script>
</body>
</html>
