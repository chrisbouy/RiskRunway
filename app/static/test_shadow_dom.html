<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HawkSoft Web — Policy Entry</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  .app-header { background: #16213e; padding: 12px 20px; margin-bottom: 20px; border-radius: 4px; }
  .app-header h1 { font-size: 16px; color: #4fc3f7; margin: 0; }
  policy-form { display: block; background: #0f3460; padding: 20px; border-radius: 8px; }
</style>
</head>
<body>
<div class="app-header">
  <h1>HawkSoft Web — New Policy</h1>
</div>

<!-- Web component with shadow DOM encapsulating form fields -->
<policy-form></policy-form>

<script>
class PolicyForm extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.lineCount = 1;
    this.shadowRoot.innerHTML = `
      <style>
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 11px; color: #90caf9; text-transform: uppercase; letter-spacing: 0.05em; }
        .field input, .field select {
          background: #1a1a2e; border: 1px solid #4fc3f7; color: #e0e0e0;
          padding: 8px; border-radius: 4px; font-size: 13px;
        }
        .field input:focus, .field select:focus { outline: 2px solid #4fc3f7; }
        h3 { color: #4fc3f7; font-size: 13px; margin: 16px 0 10px; border-bottom: 1px solid #4fc3f7; padding-bottom: 4px; }
      </style>

      <h3>Insured</h3>
      <div class="form-grid">
        <div class="field">
          <label for="insured">Insured Name</label>
          <input type="text" id="insured" name="insured_name">
        </div>
        <div class="field">
          <label for="addr">Address</label>
          <input type="text" id="addr" name="address">
        </div>
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" name="city">
        </div>
        <div class="field">
          <label for="state">State</label>
          <select id="state" name="state">
            <option value="">--</option>
            <option>AL</option><option>AK</option><option>AZ</option><option>AR</option>
            <option>CA</option><option>CO</option><option>CT</option><option>DE</option>
            <option>FL</option><option>GA</option><option>HI</option><option>ID</option>
            <option>IL</option><option>IN</option><option>IA</option><option>KS</option>
            <option>KY</option><option>LA</option><option>ME</option><option>MD</option>
            <option>MA</option><option>MI</option><option>MN</option><option>MS</option>
            <option>MO</option><option>MT</option><option>NE</option><option>NV</option>
            <option>NH</option><option>NJ</option><option>NM</option><option>NY</option>
            <option>NC</option><option>ND</option><option>OH</option><option>OK</option>
            <option>OR</option><option>PA</option><option>RI</option><option>SC</option>
            <option>SD</option><option>TN</option><option>TX</option><option>UT</option>
            <option>VT</option><option>VA</option><option>WA</option><option>WV</option>
            <option>WI</option><option>WY</option>
          </select>
        </div>
        <div class="field">
          <label for="zip">Zip</label>
          <input type="text" id="zip" name="zip">
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="text" id="phone" name="phone">
        </div>
      </div>

      <h3>Policy</h3>
      <div class="form-grid">
        <div class="field">
          <label for="carrier">Carrier</label>
          <input type="text" id="carrier" name="carrier">
        </div>
        <div class="field">
          <label for="polnum">Policy Number</label>
          <input type="text" id="polnum" name="policy_number">
        </div>
        <div class="field">
          <label for="lob">Line of Business</label>
          <select id="lob" name="line_of_business">
            <option value="">-- Select --</option>
            <option>General Liability</option>
            <option>Commercial Auto</option>
            <option>Workers Comp</option>
            <option>Property</option>
            <option>Umbrella</option>
            <option>Professional Liability</option>
            <option>Cyber</option>
          </select>
        </div>
        <div class="field">
          <label for="eff">Effective</label>
          <input type="text" id="eff" name="effective_date">
        </div>
        <div class="field">
          <label for="exp">Expiration</label>
          <input type="text" id="exp" name="expiration_date">
        </div>
        <div class="field">
          <label for="prem">Premium</label>
          <input type="text" id="prem" name="premium">
        </div>
      </div>

      <h3>Producer</h3>
      <div class="form-grid">
        <div class="field">
          <label for="producer">Producer Name</label>
          <input type="text" id="producer" name="producer">
        </div>
        <div class="field">
          <label for="broker">Broker/MGA</label>
          <input type="text" id="broker" name="broker">
        </div>
      </div>

      <h3>Line Items</h3>
      <div id="lineItemsContainer">
        <div class="form-grid" style="margin-bottom:8px;">
          <div class="field"><label>Coverage</label><input type="text" name="line_coverage_1"></div>
          <div class="field"><label>Description</label><input type="text" name="line_desc_1"></div>
          <div class="field"><label>Limit</label><input type="text" name="line_limit_1"></div>
          <div class="field"><label>Premium</label><input type="text" name="line_premium_1"></div>
        </div>
      </div>
      <button id="addLineBtn" style="background:#4fc3f7;color:#1a1a2e;border:none;padding:6px 12px;font-size:11px;cursor:pointer;border-radius:4px;font-weight:600;">+ Add Line</button>
    `;

    this.shadowRoot.getElementById('addLineBtn').addEventListener('click', () => {
      this.lineCount++;
      const container = this.shadowRoot.getElementById('lineItemsContainer');
      const row = document.createElement('div');
      row.className = 'form-grid';
      row.style.marginBottom = '8px';
      row.innerHTML = `
        <div class="field"><label>Coverage</label><input type="text" name="line_coverage_${this.lineCount}"></div>
        <div class="field"><label>Description</label><input type="text" name="line_desc_${this.lineCount}"></div>
        <div class="field"><label>Limit</label><input type="text" name="line_limit_${this.lineCount}"></div>
        <div class="field"><label>Premium</label><input type="text" name="line_premium_${this.lineCount}"></div>
      `;
      container.appendChild(row);
    });
  }
}
customElements.define('policy-form', PolicyForm);
</script>
</body>
</html>
