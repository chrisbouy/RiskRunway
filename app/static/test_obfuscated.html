<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMS360 — New Business Entry</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
  .form-container { max-width: 800px; margin: 0 auto; background: #fff; padding: 24px; border: 1px solid #ccc; }
  h2 { color: #333; border-bottom: 2px solid #0066cc; padding-bottom: 8px; }
  .row { display: flex; gap: 16px; margin-bottom: 12px; }
  .field { flex: 1; }
  .field span { display: block; font-size: 12px; color: #555; margin-bottom: 4px; font-weight: bold; }
  .field input, .field select { width: 100%; padding: 6px 8px; border: 1px solid #999; font-size: 13px; }
</style>
</head>
<body>
<div class="form-container">
  <h2>New Business — Policy Information</h2>
  <p style="font-size:11px;color:#888;">AMS360 v12.4.1 — Form ID: NB-POL-2024</p>

  <!-- No labels, no names, no aria — just adjacent span text and random IDs -->
  <div class="row">
    <div class="field">
      <span>Named Insured</span>
      <input type="text" id="f_3x7k2" autocomplete="off">
    </div>
    <div class="field">
      <span>DBA</span>
      <input type="text" id="f_9m2p1" autocomplete="off">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <span>Mailing Address Line 1</span>
      <input type="text" id="f_a4b8c" autocomplete="off">
    </div>
    <div class="field">
      <span>City</span>
      <input type="text" id="f_d2e6f" autocomplete="off">
    </div>
    <div class="field">
      <span>St</span>
      <select id="f_g1h5i">
        <option value="">--</option>
        <option>AL</option><option>AK</option><option>AZ</option><option>AR</option>
        <option>CA</option><option>CO</option><option>CT</option><option>DE</option>
        <option>FL</option><option>GA</option><option>HI</option><option>ID</option>
        <option>IL</option><option>IN</option><option>IA</option><option>KS</option>
        <option>KY</option><option>LA</option><option>ME</option><option>MD</option>
        <option>MA</option><option>MI</option><option>MN</option><option>MS</option>
        <option>MO</option><option>MT</option><option>NE</option><option>NV</option>
        <option>NH</option><option>NJ</option><option>NM</option><option>NY</option>
        <option>NC</option><option>ND</option><option>OH</option><option>OK</option>
        <option>OR</option><option>PA</option><option>RI</option><option>SC</option>
        <option>SD</option><option>TN</option><option>TX</option><option>UT</option>
        <option>VT</option><option>VA</option><option>WA</option><option>WV</option>
        <option>WI</option><option>WY</option>
      </select>
    </div>
    <div class="field">
      <span>Zip</span>
      <input type="text" id="f_j3k7l" autocomplete="off">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <span>Carrier</span>
      <input type="text" id="f_m8n4o" autocomplete="off">
    </div>
    <div class="field">
      <span>Policy #</span>
      <input type="text" id="f_p5q9r" autocomplete="off">
    </div>
    <div class="field">
      <span>Line of Business</span>
      <select id="f_s2t6u">
        <option value="">-- Select --</option>
        <option>CGL</option>
        <option>CA</option>
        <option>WC</option>
        <option>PROP</option>
        <option>UMB</option>
        <option>PL</option>
        <option>CYBER</option>
        <option>BOP</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <span>Eff Date</span>
      <input type="text" id="f_v1w3x" autocomplete="off">
    </div>
    <div class="field">
      <span>Exp Date</span>
      <input type="text" id="f_y7z0a" autocomplete="off">
    </div>
    <div class="field">
      <span>Premium</span>
      <input type="text" id="f_b4c8d" autocomplete="off">
    </div>
    <div class="field">
      <span>Producer</span>
      <input type="text" id="f_e2f6g" autocomplete="off">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <span>Wholesaler/MGA</span>
      <input type="text" id="f_h9i1j" autocomplete="off">
    </div>
    <div class="field">
      <span>Commission %</span>
      <input type="text" id="f_k3l7m" autocomplete="off">
    </div>
  </div>

  <h2 style="color:#333;border-bottom:2px solid #0066cc;padding-bottom:8px;margin-top:24px;">Line Items</h2>
  <table id="lineItemsTable" style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px;">
    <thead>
      <tr style="background:#e8e8e8;">
        <th style="padding:6px 8px;text-align:left;border:1px solid #ccc;">Coverage</th>
        <th style="padding:6px 8px;text-align:left;border:1px solid #ccc;">Description</th>
        <th style="padding:6px 8px;text-align:left;border:1px solid #ccc;">Limit</th>
        <th style="padding:6px 8px;text-align:left;border:1px solid #ccc;">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="border:1px solid #ccc;padding:4px;"><input type="text" name="line_coverage_1" style="width:100%;padding:4px;border:1px solid #999;font-size:12px;"></td>
        <td style="border:1px solid #ccc;padding:4px;"><input type="text" name="line_desc_1" style="width:100%;padding:4px;border:1px solid #999;font-size:12px;"></td>
        <td style="border:1px solid #ccc;padding:4px;"><input type="text" name="line_limit_1" style="width:100%;padding:4px;border:1px solid #999;font-size:12px;"></td>
        <td style="border:1px solid #ccc;padding:4px;"><input type="text" name="line_premium_1" style="width:100%;padding:4px;border:1px solid #999;font-size:12px;"></td>
      </tr>
    </tbody>
  </table>
  <button onclick="addLineItem()" style="background:#0066cc;color:white;border:none;padding:6px 12px;font-size:12px;cursor:pointer;border-radius:3px;">+ Add Line</button>

  <script>
    let lineCount = 1;
    function addLineItem() {
      lineCount++;
      const tbody = document.querySelector('#lineItemsTable tbody');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td style="border:1px solid #ccc;padding:4px;"><input type="text" name="line_coverage_${lineCount}" style="width:100%;padding:4px;border:1px solid #999;font-size:12px;"></td>
        <td style="border:1px solid #ccc;padding:4px;"><input type="text" name="line_desc_${lineCount}" style="width:100%;padding:4px;border:1px solid #999;font-size:12px;"></td>
        <td style="border:1px solid #ccc;padding:4px;"><input type="text" name="line_limit_${lineCount}" style="width:100%;padding:4px;border:1px solid #999;font-size:12px;"></td>
        <td style="border:1px solid #ccc;padding:4px;"><input type="text" name="line_premium_${lineCount}" style="width:100%;padding:4px;border:1px solid #999;font-size:12px;"></td>
      `;
      tbody.appendChild(row);
    }
  </script>
</div>
</body>
</html>
